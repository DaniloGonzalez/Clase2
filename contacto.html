<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>CONTACTO</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <header>
            <div id="contenedor nombre">
                <h1 id="nombre">Mercado Libre</h1>
            </div>
            <div id="contenedor-buscador">
                <input type="text" placeholder="buscar..."/>
            </div>
            <nav>
                <ul>
                    <li>Home</li>
                    <li>Contacto</li>
                </ul>

            </nav>
        </header>
        <main>
            <h1>Formulario de Contacto</h1>
            <div id="seccion_formulario">
                <div class="seccion_formulario">
                    <label>Nombre :</label>
                    <input class="input_formulario" type="text"/>
                </div>
                <div class="seccion_formulario">
                    <label>Correo :</label>
                    <input class="input_formulario" type="email" />
                </div>
                
                <div class="seccion_formulario">
                    <label>Mensaje</label>
                    <textarea class="input_formulario"></textarea>
                    <button>Enviar</button>
                </div>
            </div>

        </main>
        <footer>
            <h3>Mercado Libre - todos los derechos reservado - 2026</h3>

        </footer>
    </body>


</html>
